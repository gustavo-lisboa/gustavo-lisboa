<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Cyber Battle — pixel animation</title>
<desc id="desc">An animated pixel-art battle between a blue tech guardian and a pink digital monster.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#27405d" stroke-width="1" opacity=".45"/></pattern>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#070c17"/></linearGradient>
</defs>
<rect width="900" height="300" fill="url(#bg)"/><rect width="900" height="300" fill="url(#grid)"/>
<path d="M0 225H900" stroke="#4fe5ff" stroke-opacity=".45" stroke-width="2"/>
<path d="M0 250H900" stroke="#20334d" stroke-width="25"/>
<g font-family="monospace" font-weight="bold" font-size="13" fill="#72eaff" letter-spacing="2"><text x="28" y="30">GUSTAVO.EXE</text><text x="28" y="48" fill="#8198b8" font-size="10">CYBER ARENA // TRAINING SIMULATION</text></g>
<g font-family="monospace" font-size="11" fill="#ffd36a" letter-spacing="2"><text x="450" y="34" text-anchor="middle">BATTLE IN PROGRESS</text></g>
<g transform="translate(0 0)">
  <g transform="translate(185 94)">
    <animateTransform attributeName="transform" type="translate" values="185 94;185 88;185 94" dur="1.1s" repeatCount="indefinite"/>
    <rect x="26" y="0" width="42" height="12" fill="#53cfff"/><rect x="18" y="12" width="58" height="42" fill="#b9f4ff"/>
    <rect x="27" y="22" width="12" height="12" fill="#10233d"/><rect x="55" y="22" width="12" height="12" fill="#10233d"/>
    <rect x="31" y="25" width="5" height="5" fill="#65eaff"/><rect x="59" y="25" width="5" height="5" fill="#65eaff"/>
    <rect x="12" y="54" width="70" height="54" fill="#286bb1"/><rect x="0" y="60" width="12" height="34" fill="#b9f4ff"/><rect x="82" y="60" width="12" height="34" fill="#b9f4ff"/>
    <rect x="22" y="108" width="20" height="32" fill="#a5c7e9"/><rect x="52" y="108" width="20" height="32" fill="#a5c7e9"/>
    <rect x="16" y="140" width="28" height="10" fill="#53cfff"/><rect x="50" y="140" width="28" height="10" fill="#53cfff"/>
    <rect x="39" y="62" width="16" height="16" fill="#53e6ff"/>
  </g>
  <g transform="translate(580 95)">
    <animateTransform attributeName="transform" type="translate" values="580 95;580 87;580 95" dur="1.35s" repeatCount="indefinite"/>
    <rect x="25" y="0" width="52" height="14" fill="#8b2859"/><rect x="12" y="14" width="78" height="60" fill="#e44780"/>
    <rect x="22" y="28" width="20" height="18" fill="#fff0f5"/><rect x="60" y="28" width="20" height="18" fill="#fff0f5"/>
    <rect x="29" y="33" width="10" height="12" fill="#241127"/><rect x="65" y="33" width="10" height="12" fill="#241127"/>
    <rect x="37" y="55" width="30" height="7" fill="#68183f"/><rect x="22" y="74" width="18" height="34" fill="#a92f62"/><rect x="62" y="74" width="18" height="34" fill="#a92f62"/>
    <rect x="12" y="38" width="12" height="22" fill="#ff8db7"/><rect x="78" y="38" width="12" height="22" fill="#ff8db7"/>
    <rect x="18" y="108" width="24" height="22" fill="#8b2859"/><rect x="60" y="108" width="24" height="22" fill="#8b2859"/>
  </g>
</g>
<g opacity="0">
  <circle cx="450" cy="145" r="24" fill="#fff"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></circle>
</g>
<g>
  <path d="M310 165l10 -10 10 10 -10 10z" fill="#6beaff"><animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;155 -8;0 0" dur="1s" repeatCount="indefinite"/></path>
  <path d="M490 156l9 -9 9 9 -9 9z" fill="#ff6fa9"><animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-115 8;0 0" dur="1.2s" repeatCount="indefinite"/></path>
  <g transform="translate(452 145)" opacity="0"><path d="M0 -22L6 -6L22 0L6 6L0 22L-6 6L-22 0L-6 -6Z" fill="#ffd36a"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></path></g>
</g>
<g font-family="monospace" font-size="12" font-weight="bold">
 <text x="232" y="275" text-anchor="middle" fill="#70e7ff">PLAYER 01</text>
 <text x="625" y="275" text-anchor="middle" fill="#ff75aa">BUG.EXE</text>
 <rect x="130" y="253" width="205" height="8" fill="#263950"/><rect x="130" y="253" width="205" height="8" fill="#50e6ff"><animate attributeName="width" values="205;160;205" dur="4s" repeatCount="indefinite"/></rect>
 <rect x="522" y="253" width="205" height="8" fill="#263950"/><rect x="522" y="253" width="205" height="8" fill="#f24f87"><animate attributeName="width" values="205;135;205" dur="3.5s" repeatCount="indefinite"/></rect>
</g>
<text x="450" y="294" font-family="monospace" font-size="9" fill="#6d839f" text-anchor="middle" letter-spacing="1">PIXEL BATTLE LOOP • PORTFOLIO PROJECT</text>
</svg>